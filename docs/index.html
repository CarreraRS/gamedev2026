<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarreraRS Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1a0b2e 0%, #0a0512 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(138, 43, 226, 0.2);
            filter: blur(100px);
            border-radius: 50%;
            top: 20%;
            left: 30%;
            z-index: 0;
        }

        .container {
            text-align: center;
            z-index: 1;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 2.5rem;
            line-height: 1.6;
            letter-spacing: 0.5px;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
            color: #f3e8ff;
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        li {
            width: 100%;
            max-width: 350px;
        }

        .game-btn {
            display: block;
            text-decoration: none;
            color: #e9d5ff;
            font-size: 1.1rem;
            padding: 14px 28px;
            border: 1px solid rgba(168, 85, 247, 0.3); /* ขอบม่วงจางๆ */
            background: rgba(255, 255, 255, 0.03); /* ใสแบบมินิมอล */
            border-radius: 12px;
            backdrop-filter: blur(5px); /* เบลอหลังปุ่มเล็กน้อย */
            transition: all 0.3s ease;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }

        .game-btn:hover {
            background: rgba(168, 85, 247, 0.15); /* สว่างขึ้นเป็นสีม่วงใส */
            border-color: rgba(168, 85, 247, 0.8); /* ขอบม่วงชัดขึ้น */
            color: #ffffff;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4); /* เรืองแสง */
            transform: translateY(-3px); /* ลอยขึ้นเล็กน้อย */
        }

        .game-btn:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ยินดีต้อนรับสู่เว็บรวมเกมของ<br>นาย ศิริวัฒน์ ไหวดี 673380346-8 sec.2</h1>
        
        <ul>
            <li><a href="./game21/" class="game-btn">🕹️ lab2 เกมที่ 1</a></li>
            <li><a href="./game22_ghetto/" class="game-btn">🕹️ lab2 เกมที่ 2</a></li>
        </ul>
    </div>

</body>
</html>
